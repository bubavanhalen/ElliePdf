name: Agent – Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-x64:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Patch version in csproj
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $csproj = Get-Content ElliePdf.csproj -Raw
          if ($csproj -match '<Version>') {
            $csproj = $csproj -replace '<Version>[^<]*</Version>', "<Version>$v</Version>"
          } else {
            $csproj = $csproj -replace '</PropertyGroup>', "  <Version>$v</Version>`n  </PropertyGroup>"
          }
          Set-Content ElliePdf.csproj $csproj

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore ElliePdf.slnx

      - name: Build & test
        run: |
          dotnet build ElliePdf.slnx -c Release -p:Platform=x64 --no-restore
          dotnet test ElliePdf.Tests/ElliePdf.Tests.csproj -c Release -p:Platform=x64

      - name: Publish x64 self-contained
        run: >
          dotnet publish ElliePdf.csproj
          -c Release
          -p:Platform=x64
          -p:PublishSingleFile=true
          --self-contained true
          -r win-x64
          -o publish/x64

      - name: Zip x64 artifact
        shell: pwsh
        run: |
          Compress-Archive -Path publish/x64/* -DestinationPath ElliePdf-${{ steps.version.outputs.version }}-win-x64.zip

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: ElliePdf-${{ steps.version.outputs.version }}-win-x64.zip

  build-arm64:
    runs-on: windows-latest
    needs: build-x64
    steps:
      - uses: actions/checkout@v4

      - name: Patch version in csproj
        shell: pwsh
        run: |
          $v = "${{ needs.build-x64.outputs.version }}"
          $csproj = Get-Content ElliePdf.csproj -Raw
          if ($csproj -match '<Version>') {
            $csproj = $csproj -replace '<Version>[^<]*</Version>', "<Version>$v</Version>"
          } else {
            $csproj = $csproj -replace '</PropertyGroup>', "  <Version>$v</Version>`n  </PropertyGroup>"
          }
          Set-Content ElliePdf.csproj $csproj

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore ElliePdf.slnx

      - name: Publish ARM64 self-contained
        run: >
          dotnet publish ElliePdf.csproj
          -c Release
          -p:Platform=ARM64
          -p:PublishSingleFile=true
          --self-contained true
          -r win-arm64
          -o publish/arm64

      - name: Zip ARM64 artifact
        shell: pwsh
        run: |
          Compress-Archive -Path publish/arm64/* -DestinationPath ElliePdf-${{ needs.build-x64.outputs.version }}-win-arm64.zip

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-arm64
          path: ElliePdf-${{ needs.build-x64.outputs.version }}-win-arm64.zip

  create-release:
    runs-on: ubuntu-latest
    needs: [build-x64, build-arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate changelog with Copilot
        uses: github/copilot-cli-action@v1
        with:
          prompt: |
            You are a technical writer creating release notes for ElliePdf v${{ needs.build-x64.outputs.version }}.

            ElliePdf is a Windows native PDF reader and organizer built with WinUI 3 and PDFium.
            Key features: multi-tab reading, zoom/search, ink/text/signature annotations,
            page organize (reorder/rotate/delete), merge/export, recent files, password-protected PDFs.

            1. Run: git log --oneline $(git describe --tags --abbrev=0 HEAD^)..HEAD
            2. Categorize commits into: ✨ Features, 🐛 Bug Fixes, 🔧 Improvements, 📦 Dependencies
            3. Write concise, user-facing release notes in Markdown (no commit hashes, no jargon)
            4. Save the output to RELEASE_NOTES.md in the repo root (overwrite if exists)

            Version: ${{ needs.build-x64.outputs.version }}
          mode: autopilot
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read release notes
        id: notes
        run: |
          NOTES=$(cat RELEASE_NOTES.md 2>/dev/null || echo "Release ${{ needs.build-x64.outputs.version }}")
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ElliePdf ${{ needs.build-x64.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/win-x64/*.zip
            artifacts/win-arm64/*.zip
