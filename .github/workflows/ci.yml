name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore ElliePdf.slnx

      - name: Build
        run: dotnet build ElliePdf.slnx -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test ElliePdf.Tests/ElliePdf.Tests.csproj -c Release -p:Platform=x64
