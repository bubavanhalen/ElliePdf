name: Agent – Feature Implementation

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  scaffold-feature:
    if: github.event.label.name == 'feature'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Scaffold feature with Copilot
        uses: github/copilot-cli-action@v1
        with:
          prompt: |
            You are a senior .NET developer working on ElliePdf — a WinUI 3 PDF reader and organizer.

            ## Architecture overview
            - Services layer: interfaces in Services/ (IPdfService, IDocumentTabService, etc.) with DI wiring in App.xaml.cs
            - ViewModels layer: MVVM via CommunityToolkit.Mvvm (ObservableObject, [ObservableProperty], [RelayCommand])
            - Pages layer: Pages/ with code-behind binding to ViewModels
            - Core library: ElliePdf.Core/ for pure .NET logic (no WinUI)
            - PDFium wrapper: Services/PdfiumNative.cs + PdfService.cs
            - Tests: ElliePdf.Tests/ (xunit, net11.0)

            ## Task
            Implement the feature described in GitHub issue #${{ github.event.issue.number }}:

            **Title:** ${{ github.event.issue.title }}

            **Body:**
            ${{ github.event.issue.body }}

            ## Instructions
            1. Read the relevant existing source files to understand the affected area
            2. Identify the correct layer(s) to modify (service interface → implementation → viewmodel → XAML)
            3. Make surgical, focused changes — extend interfaces before adding new ones
            4. Add a stub implementation with TODO comments where complex PDFium work is needed
            5. Wire DI registration in App.xaml.cs if new services are added
            6. Add or update xUnit tests in ElliePdf.Tests/ for any new pure logic
            7. Create a draft pull request targeting master with:
               - Title: "feat: <short description from issue title>"
               - Body referencing "Closes #${{ github.event.issue.number }}"
               - Label: feature

            Branch name: feature/issue-${{ github.event.issue.number }}
          mode: autopilot
          github-token: ${{ secrets.GITHUB_TOKEN }}
