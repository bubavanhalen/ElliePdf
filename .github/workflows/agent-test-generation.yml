name: Agent – Test Generation

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'Services/**/*.cs'
      - 'ViewModels/**/*.cs'
      - 'ElliePdf.Core/**/*.cs'
  workflow_dispatch:
    inputs:
      model:
        description: 'AI model to use (e.g. gpt-latest, claude-sonnet, o-mini-latest)'
        required: false
        default: ''

permissions:
  contents: write
  models: read
  pull-requests: write

jobs:
  generate-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Detect changed C# files
        id: changed
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          mapfile -t FILE_LIST < <(git diff --name-only --diff-filter=ACMRT "$BASE" "$HEAD" \
            | grep -E '^(Services|ViewModels|ElliePdf\.Core)/.+\.cs$' \
            | grep -v '\.Tests\.' || true)

          TOTAL_BYTES=0
          for file in "${FILE_LIST[@]}"; do
            [ -f "$file" ] || continue
            TOTAL_BYTES=$((TOTAL_BYTES + $(wc -c < "$file")))
          done

          # AI-generated tests are useful for focused changes. Large refactors exceed a
          # reviewable prompt and already carry dedicated contract/integration suites.
          if [ "${#FILE_LIST[@]}" -gt 12 ] || [ "$TOTAL_BYTES" -gt 100000 ]; then
            echo "::notice title=Test generation skipped::Changed source set is too large (${#FILE_LIST[@]} files, $TOTAL_BYTES bytes)."
            FILES=""
          else
            FILES=$(printf '%s\n' "${FILE_LIST[@]}")
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "has_files=$([ -n "$FILES" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Read changed source files
        if: steps.changed.outputs.has_files == 'true'
        id: sources
        run: |
          CONTENT=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            CONTENT+="### $f\n\`\`\`csharp\n$(cat "$f")\n\`\`\`\n\n"
          done <<< "${{ steps.changed.outputs.files }}"
          echo "content<<EOF" >> "$GITHUB_OUTPUT"
          printf "%s" "$CONTENT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate tests with AI
        if: steps.changed.outputs.has_files == 'true'
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: ${{ inputs.model || vars.AGENT_MODEL || 'gpt-latest' }}
          system-prompt-file: .github/prompts/system-dotnet.txt
          prompt: |
            Generate xUnit tests for the following changed C# files in the ElliePdf project.

            ## Rules
            - Test project: ElliePdf.Tests/ (framework net11.0 — no WinUI, no Windows App SDK)
            - Use NSubstitute for mocking interfaces
            - Cover public methods: happy path + edge cases
            - Skip methods that require WinUI, P/Invoke, or direct file I/O
            - Name each file <ClassName>Tests.cs in ElliePdf.Tests/
            - Do not duplicate ZoomScaleCalculatorTests.cs
            - Output ONLY complete, compilable C# files, each preceded by a line: FILE: <path>

            ## Changed files
            ${{ steps.sources.outputs.content }}

      - name: Write test files and commit
        if: steps.changed.outputs.has_files == 'true'
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
        run: |
          # Parse FILE: markers and write each file
          python3 - <<'PYEOF'
          import os, re

          response = os.environ["AI_RESPONSE"]
          # Split on FILE: markers
          parts = re.split(r'^FILE:\s*(.+)$', response, flags=re.MULTILINE)

          i = 1
          while i < len(parts) - 1:
              path = parts[i].strip()
              body = parts[i + 1].strip()
              # Strip markdown code fences if present
              body = re.sub(r'^```\w*\n?', '', body)
              body = re.sub(r'\n?```$', '', body)
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else '.', exist_ok=True)
              with open(path, 'w') as f:
                  f.write(body + '\n')
              print(f"Written: {path}")
              i += 2
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ElliePdf.Tests/
          git diff --cached --quiet || git commit -m "test: auto-generate unit tests for changed files [skip ci]"
          git push
