name: Bug Report
description: Something is broken in ElliePdf
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in as much detail as possible so the triage agent can help quickly.

  - type: input
    id: version
    attributes:
      label: ElliePdf version
      placeholder: "e.g. 1.2.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 23H2"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a PDF
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour (include any error message or crash details)
    validations:
      required: true

  - type: dropdown
    id: password
    attributes:
      label: Was the PDF password-protected?
      options:
        - "No"
        - "Yes"
        - "Unknown"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context (screenshots, sample PDF link, etc.)
